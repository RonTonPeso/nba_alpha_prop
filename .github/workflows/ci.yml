name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nba
          POSTGRES_PASSWORD: nba
          POSTGRES_DB: nba_alpha_prop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nba -d nba_alpha_prop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nba:nba@localhost:5432/nba_alpha_prop
      NBA_LOAD_DOTENV: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Black format check
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Migrate schema
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
